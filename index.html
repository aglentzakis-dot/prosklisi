<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Πρόσκληση & Οργάνωση Εκδήλωσης</title>
<style>
:root{
  --bg:#EEF2F1;
  --paper:#FFFFFF;
  --ink:#12312E;
  --muted:#5C7370;
  --line:#D3E0DC;
  --deep:#0E4F49;
  --deep2:#136B60;
  --gold:#B57614;
  --green:#2C7A4B;
  --red:#B02A25;
  --blue:#1E5F8C;
  --soft:#F3F8F6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;
}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 80px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin:0}
h1{font-size:29px;line-height:1.22}
h2{font-size:21px;margin-bottom:8px}
h3{font-size:17px;margin-bottom:6px}
p{margin:.5em 0}
small{color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}

.invite{background:linear-gradient(165deg,var(--deep) 0%,var(--deep2) 100%);color:#F4FBF9;border-radius:20px;padding:24px 20px;position:relative}
.invite:after{content:"";position:absolute;pointer-events:none;border-radius:14px}
.pl-xriso:after{inset:9px;border:3px solid rgba(255,206,110,.9)}
.pl-diakek:after{inset:10px;border:2px dashed rgba(255,255,255,.85)}
.pl-diplo:after{inset:9px;border:1px solid rgba(255,255,255,.9);box-shadow:0 0 0 4px rgba(255,255,255,.32)}
.pl-korniza:after{inset:11px;border:4px double rgba(255,235,185,.95)}
.pl-fotini{box-shadow:0 0 0 3px rgba(255,206,110,.55),0 0 26px rgba(255,206,110,.4)}
.invite h1{color:#fff}
.invite .eyebrow{color:#9FD9C9;font-size:13px;letter-spacing:1.6px;margin-bottom:8px}
.when{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-top:12px}
.when .big{font-family:Georgia,serif;font-size:31px;color:#FFD98A;line-height:1.1}
.place{color:#C7E4DD;margin-top:6px;font-size:15px}
.msg{margin-top:13px;font-family:Georgia,serif;font-style:italic;color:#EAF6F2}
.deadline{margin-top:16px;padding:13px 15px;border-radius:13px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28)}
.dl-big{display:block;font-size:20px;font-weight:700;color:#FFD98A;line-height:1.25}
.dl-sub{display:block;font-size:13px;color:#DCEFE9;margin-top:3px}
.mapbox{margin-top:14px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.3);height:175px;background:#DCE7E3}
.mapbox iframe{width:100%;height:100%;border:0;display:block}
.dief{margin-top:12px;font-size:15px;line-height:1.4}
.xartis{display:block;text-align:center;margin-top:10px;padding:12px 15px;border-radius:12px;background:#fff;color:var(--deep);text-decoration:none;font-size:15px;font-weight:600}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
  width:100%;background:var(--paper);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:12px 13px;font-size:16px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--deep2);outline-offset:1px}

.choices{display:flex;gap:8px}
.choice{flex:1;text-align:center;padding:12px 6px;border-radius:13px;cursor:pointer;
  border:1px solid var(--line);background:var(--soft);font-size:14px;user-select:none}
.choice .ic{display:block;font-size:21px;margin-bottom:3px}
.choice{box-shadow:0 1px 3px rgba(18,49,46,.13)}
.choice[aria-pressed=true]{border-color:var(--deep);background:var(--deep);color:#fff;box-shadow:0 4px 12px rgba(14,79,73,.4)}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;margin-bottom:6px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:11px 16px;font-size:15px;cursor:pointer;color:var(--ink)}
.chip{box-shadow:0 1px 3px rgba(18,49,46,.13)}
.chip[aria-pressed=true]{border-color:#1F5C36;background:var(--green);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(44,122,75,.42)}
.chip:active,.opt:active,button:active{transform:translateY(1px)}
.optlist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:13px;padding:13px 15px;
  font-size:15px;font-family:inherit;color:var(--ink);cursor:pointer;box-shadow:0 1px 3px rgba(18,49,46,.13)}
.opt[aria-pressed=true]{border-color:#1F5C36;background:var(--green);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(44,122,75,.42)}
.opt.minima{font-size:15.5px;line-height:1.5;padding:15px 16px;border-left:5px solid var(--deep)}
.opt.minima[aria-pressed=true]{border-left-color:#1F5C36}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.55;font-style:italic}
.opt-extra{margin:-2px 2px 2px;padding:12px 14px;background:var(--soft);border:1px solid var(--line);border-radius:12px}
.opt-extra label{margin-top:0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.duo-k{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;
  background:var(--paper);border:2px solid var(--deep);color:var(--deep);font-weight:700;font-size:15px;
  font-family:inherit;cursor:pointer;border-radius:13px;padding:15px 8px;box-shadow:0 2px 6px rgba(18,49,46,.16)}
.duo-k:active{transform:translateY(1px)}
.tameio{background:#FFF6DF;border:2px solid var(--gold);border-radius:13px;padding:14px;margin-top:10px;
  font-size:17px;font-weight:700;color:#6B4400;line-height:1.45}
.synd{background:var(--soft);border:1px dashed #A9C0BA;border-radius:11px;padding:11px;font-size:14px;word-break:break-all;margin-top:10px;color:var(--muted)}
.chip[aria-pressed=true]::before{content:"✓ "}
.card h3{margin-top:26px}
.card h3:first-child{margin-top:0}
.onoma-row{margin-bottom:8px}
.num{position:relative}
.num input{padding-right:46px}
.nbtns{position:absolute;right:5px;top:5px;bottom:5px;width:36px;display:flex;flex-direction:column;gap:3px}
.nb{flex:1;border:1px solid #BFD1CC;background:var(--soft);border-radius:7px;font-size:12px;line-height:1;
  cursor:pointer;color:var(--deep);font-weight:700;padding:0;box-shadow:0 1px 2px rgba(18,49,46,.12)}
.nb:active{transform:translateY(1px)}
.kalymma{position:fixed;inset:0;background:rgba(10,26,24,.75);z-index:98;display:flex;align-items:center;justify-content:center;padding:18px}
.parathyro{background:var(--paper);border-radius:18px;padding:20px;width:100%;max-width:460px;max-height:88vh;overflow:auto}
.proepis-kalymma{touch-action:none;user-select:none;-webkit-user-select:none;position:fixed;inset:0;background:rgba(10,26,24,.88);z-index:99;display:flex;align-items:center;justify-content:center;padding:18px}
.proepis-mesa{width:100%;max-width:620px}
.proepis-lez{text-align:center;color:#CFE3DD;font-size:13px;margin-top:14px}
input[type=range]{width:100%;accent-color:var(--deep)}
.kindynos{border:1.5px dashed #E0A9A6;border-radius:13px;padding:14px;margin-top:18px;background:#FDF4F3}

.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.trio label{margin-top:0}

button.btn{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;font-family:inherit;
  background:var(--deep);color:#fff;font-weight:700;cursor:pointer;margin-top:16px;box-shadow:0 3px 9px rgba(18,49,46,.28)}
button.ghost{background:var(--paper);border:2px solid var(--deep);color:var(--deep);font-weight:700;box-shadow:0 2px 6px rgba(18,49,46,.16)}
button.mini{width:auto;padding:9px 13px;font-size:14px;margin-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-top:12px}
.tab{white-space:nowrap;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px;cursor:pointer;color:var(--ink)}
.tab[aria-pressed=true]{background:var(--deep);color:#fff;border-color:var(--deep)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:9px 5px;border-bottom:1px solid var(--line);vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:400;font-size:13px}

.stat{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat b{font-family:Georgia,serif;font-size:20px;color:var(--deep);font-weight:400}
.megala{font-family:Georgia,serif;font-size:19px;color:var(--deep);padding:10px 0;border-bottom:1px solid var(--line)}
.buy{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.buy span:last-child{color:var(--green);font-weight:700;white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.yes{color:var(--green);border-color:#A9D6BB} .no{color:var(--red);border-color:#E6BEBC} .maybe{color:var(--blue);border-color:#B9D2E4}
.item{display:grid;grid-template-columns:42px 1fr 78px 66px 34px;gap:5px;align-items:center;margin-bottom:8px}
.item input,.item select{padding:9px 7px;font-size:14px;border-radius:9px}
.del{background:#FBECEB;border:1px solid #E6BEBC;color:var(--red);border-radius:9px;padding:9px 0;cursor:pointer;font-size:15px}
.foot{text-align:center;margin-top:24px}
.foot button,.foot-l{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:0}
.protropi{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.16);
  border-left:4px solid var(--ton,#FFD98A);font-size:15px;line-height:1.45}
.metritis{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);font-size:15px}
.metritis b{font-family:Georgia,serif;font-size:21px;color:var(--ton,#FFD98A);font-weight:400}
.ok{background:#E3F3E9;border:1px solid #A9D6BB;border-radius:11px;padding:12px;margin-top:14px;font-size:15px;color:#14502F}
.empty{color:var(--muted);text-align:center;padding:20px 8px;font-size:15px}
.note{background:var(--soft);border-radius:11px;padding:10px 12px;font-size:14px;color:var(--muted);margin-top:8px}
.tick{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px}
.tick input{width:22px;height:22px}
@media (max-width:400px){.item{grid-template-columns:38px 1fr 68px 58px 32px}}
</style>
</head>

<script>
/* ================= Ρύθμιση ================= */
/*  ΒΑΛΕ ΕΔΩ τη διεύθυνση του σεναρίου Google (τελειώνει σε /exec).
    Όσο μένει κενή, η εφαρμογή δουλεύει μόνο τοπικά, στη συσκευή σου.  */
const DIEFTHINSI_FYLLOU = '';

/* ================= Αποθήκευση ================= */
const KEY_ALL='ekdilosi_koini_v2', KEY_ME='ekdilosi_dikos_mou_v2';
const meFyllo = /^https:\/\/script\.google\.com\//.test(DIEFTHINSI_FYLLOU);
let katastasiSyndesis = meFyllo?'syndeetai':'topika';

async function fylloGet(){
  const r=await fetch(DIEFTHINSI_FYLLOU+'?energeia=ola&t='+Date.now());
  if(!r.ok) throw new Error('σφάλμα '+r.status);
  return r.json();
}
async function fylloPost(antikeimeno){
  const r=await fetch(DIEFTHINSI_FYLLOU,{method:'POST',body:JSON.stringify(antikeimeno)});
  if(!r.ok) throw new Error('σφάλμα '+r.status);
  return r.json();
}
const cloud = typeof window.storage!=='undefined' && window.storage;
async function load(key,koini){
  try{ if(cloud){const r=await window.storage.get(key,koini); return r&&r.value?JSON.parse(r.value):null;} }catch(e){}
  try{ const v=window.localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; }
}
async function save(key,val,koini){
  const s=JSON.stringify(val);
  try{ if(cloud){ await window.storage.set(key,s,koini); return; } }catch(e){}
  try{ window.localStorage.setItem(key,s); }catch(e){}
}

function valeXroma(){
  const x=XROMATA.find(c=>c.id===DB.ekdilosi.selidaXroma)||XROMATA[0], r=document.documentElement.style;

  const vasi = it.alk ? it.en : it.en + it.pa*0.6;
  const raw = vasi*it.ana;
  if(raw<=0) return '—';
  if(it.monada==='κιλά') return arith(Math.ceil(raw*10)/10)+' κιλά';
  if(it.monada==='λίτρα'){
    const l=Math.ceil(raw*2)/2;
    const mp=/κρασ|σαμπ[άα]ν/i.test(it.onoma)?0.75:0.5;
    const posa=Math.ceil(l/mp);
    return arith(l)+' λίτρα · '+posa+' μπουκάλια των '+(mp===0.75?'750':'500')+' ml';
  }
  return Math.ceil(raw)+' '+it.monada;
}

/* ================= Χάρτης ================= */
function exeiPineza(){const e=DB.ekdilosi;return typeof e.plat==='number'&&typeof e.mik==='number';}
function stoxosXarti(){const e=DB.ekdilosi;return exeiPineza()?e.plat.toFixed(6)+','+e.mik.toFixed(6):(e.dieuthinsi||e.topos||'');}
function syndesmosXarti(){const s=stoxosXarti();return s?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s):'';}
function vresSyntetagmenes(k){
  const t=decodeURIComponent((k||'').trim()).replace(/[()]/g,' ');
  const elegxos=(a,b)=>(!isNaN(a)&&!isNaN(b)&&Math.abs(a)<=90&&Math.abs(b)<=180)?{plat:a,mik:b}:null;

  let m=t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if(m){ const r=elegxos(parseFloat(m[1]),parseFloat(m[2])); if(r) return r; }

  m=t.match(/[?&](?:q|ll|daddr|destination|center)=(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
  if(m){ const r=elegxos(parseFloat(m[1]),parseFloat(m[2])); if(r) return r; }

  m=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m){ const r=elegxos(parseFloat(m[1]),parseFloat(m[2])); if(r) return r; }

  m=t.match(/(\d{1,3})[°º]\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([NSΒΝ])[,\s]+(\d{1,3})[°º]\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([EWΑΔ])/i);
  if(m){
    const dms=(d,mn,sc)=>(+d)+(+mn)/60+(+sc)/3600;
    let a=dms(m[1],m[2],m[3]), b=dms(m[5],m[6],m[7]);
    if(/^[SΝ]$/i.test(m[4])&&m[4].toUpperCase()==='S') a=-a;
    if(m[8].toUpperCase()==='W') b=-b;
    const r=elegxos(a,b); if(r) return r;
  }

  m=t.match(/(-?\d{1,2}[.,]\d{3,})\s*[,;\s/]+\s*(-?\d{1,3}[.,]\d{3,})/);
  if(m){ const r=elegxos(parseFloat(m[1].replace(',','.')),parseFloat(m[2].replace(',','.'))); if(r) return r; }
  return null;
}

/* ================= Προθεσμία ================= */
function oraProthesmias(){const e=DB.ekdilosi;return e.prothImer?new Date(e.prothImer+'T'+(e.prothOra||'23:59')+':00').getTime():null;}
function kleidomeno(){ if(DB.ekdilosi.kleista) return true; const t=oraProthesmias(); return t!==null&&Date.now()>t; }
function keimenoProthesmias(){
  const e=DB.ekdilosi;
  if(e.kleista) return {meg:'Οι δηλώσεις έκλεισαν',mik:''};
  const t=oraProthesmias(); if(t===null) return null;
  const d=t-Date.now();
  if(d<=0) return {meg:'Η προθεσμία πέρασε',mik:'Έληξε '+grafiImerominia(e.prothImer)+', '+e.prothOra};
  const me=Math.floor(d/86400000), or=Math.floor(d/3600000)%24, le=Math.floor(d/60000)%60;
  let apo;
  if(me>0) apo=(me===1?'μία μέρα':me+' μέρες')+(or?' και '+(or===1?'μία ώρα':or+' ώρες'):'');
  else if(or>0) apo=(or===1?'μία ώρα':or+' ώρες')+(le?' και '+le+' λεπτά':'');
  else apo=le<=1?'λιγότερο από ένα λεπτό':le+' λεπτά';
  return {meg:'Απομένουν '+apo,mik:'Απάντησε μέχρι '+grafiImerominia(e.prothImer)+', '+e.prothOra};
}
function htmlProthesmias(){
  const k=keimenoProthesmias();
  if(!k) return '';
  return `<span class="dl-big">${esc(k.meg)}</span>${k.mik?`<span class="dl-sub">${esc(k.mik)}</span>`:''}`;
}

/* Συμπαγής δημιουργός QR — byte mode, επίπεδο διόρθωσης M, εκδόσεις 1-10 */
function qrModules(keimeno){
  const XOR=0x11D, EXP=new Array(512), LOG=new Array(256);
  for(let i=0,x=1;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&256) x^=XOR; }
  for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
  const mul=(a,b)=>(a===0||b===0)?0:EXP[LOG[a]+LOG[b]];

  const CAP=[null,14,26,42,62,84,106,122,152,180,213];
  const ECW=[null,10,16,26,18,24,16,18,22,22,26];
  const BLOCKS=[null,
    [[1,16]],[[1,28]],[[1,44]],[[2,32]],[[2,43]],[[4,27]],[[4,31]],
    [[2,38],[2,39]],[[3,36],[2,37]],[[4,43],[1,44]]];
  const ALIGN=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  const VERINFO={7:0x07C94,8:0x085BC,9:0x09A99,10:0x0A4D3};
  const FORMAT_M=[0x5412,0x5125,0x5E7C,0x5B4B,0x45F9,0x40CE,0x4F97,0x4AA0];

  const dedom=Array.from(new TextEncoder().encode(keimeno));
  let ver=0;
  for(let v=1;v<=10;v++) if(dedom.length<=CAP[v]){ ver=v; break; }
  if(!ver) throw new Error('Πολύ μεγάλο κείμενο για κωδικό QR');

  /* --- ροή δυαδικών --- */
  const bits=[];
  const push=(timi,plithos)=>{ for(let i=plithos-1;i>=0;i--) bits.push((timi>>i)&1); };
  push(4,4);
  push(dedom.length, ver<10?8:16);
  dedom.forEach(b=>push(b,8));
  const synolikaData=BLOCKS[ver].reduce((s,[n,d])=>s+n*d,0);
  const maxBits=synolikaData*8;
  for(let i=0;i<4&&bits.length<maxBits;i++) bits.push(0);
  while(bits.length%8) bits.push(0);
  const padByte=[0xEC,0x11]; let pi=0;
  while(bits.length<maxBits){ push(padByte[pi++%2],8); }
  const data=[];
  for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; data.push(b); }

  /* --- Reed-Solomon --- */
  function genPoly(n){
    let g=[1];
    for(let i=0;i<n;i++){
      const neo=new Array(g.length+1).fill(0);
      for(let j=0;j<g.length;j++){ neo[j]^=mul(g[j],1); neo[j+1]^=mul(g[j],EXP[i]); }
      g=neo;
    }
    return g;
  }
  const g=genPoly(ECW[ver]);
  function ec(mplok){
    const res=new Array(ECW[ver]).fill(0);
    mplok.forEach(b=>{
      const factor=b^res[0];
      res.shift(); res.push(0);
      for(let i=0;i<g.length-1;i++) res[i]^=mul(g[i+1],factor);
    });
    return res;
  }

  const mplokData=[], mplokEc=[]; let thesi=0;
  BLOCKS[ver].forEach(([n,d])=>{
    for(let i=0;i<n;i++){ const b=data.slice(thesi,thesi+d); thesi+=d; mplokData.push(b); mplokEc.push(ec(b)); }
  });
  const teliko=[];
  const megD=Math.max(...mplokData.map(b=>b.length));
  for(let i=0;i<megD;i++) mplokData.forEach(b=>{ if(i<b.length) teliko.push(b[i]); });
  for(let i=0;i<ECW[ver];i++) mplokEc.forEach(b=>teliko.push(b[i]));

  /* --- πλέγμα --- */
  const N=ver*4+17;
  const m=Array.from({length:N},()=>new Array(N).fill(null));
  const leit=Array.from({length:N},()=>new Array(N).fill(false));
  const set=(r,c,v,f)=>{ m[r][c]=v; if(f) leit[r][c]=true; };

  const finder=(r,c)=>{
    for(let i=-1;i<=7;i++) for(let j=-1;j<=7;j++){
      const rr=r+i, cc=c+j;
      if(rr<0||cc<0||rr>=N||cc>=N) continue;
      const mesa=(i>=0&&i<=6&&j>=0&&j<=6);
      const mavro=mesa&&((i===0||i===6||j===0||j===6)||(i>=2&&i<=4&&j>=2&&j<=4));
      set(rr,cc,mavro?1:0,true);
    }
  };
  finder(0,0); finder(0,N-7); finder(N-7,0);

  for(let i=8;i<N-8;i++){ set(6,i,i%2===0?1:0,true); set(i,6,i%2===0?1:0,true); }

  ALIGN[ver].forEach(r=>ALIGN[ver].forEach(c=>{
    if((r===6&&c===6)||(r===6&&c===N-7)||(r===N-7&&c===6)) return;
    for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++){
      const mavro=(Math.abs(i)===2||Math.abs(j)===2||(i===0&&j===0));
      set(r+i,c+j,mavro?1:0,true);
    }
  }));

  set(N-8,8,1,true);
  for(let i=0;i<9;i++){ if(!leit[8][i]) set(8,i,0,true); if(!leit[i][8]) set(i,8,0,true); }
  for(let i=0;i<8;i++){ if(!leit[8][N-1-i]) set(8,N-1-i,0,true); if(!leit[N-1-i][8]) set(N-1-i,8,0,true); }
  if(ver>=7){
    for(let i=0;i<18;i++){
      const b=(VERINFO[ver]>>i)&1;
      set(Math.floor(i/3), N-11+(i%3), b, true);
      set(N-11+(i%3), Math.floor(i/3), b, true);
    }
  }

  /* --- τοποθέτηση δεδομένων --- */
  let dbits=[];
  teliko.forEach(b=>{ for(let i=7;i>=0;i--) dbits.push((b>>i)&1); });
  let idx=0, up=true;
  for(let c=N-1;c>0;c-=2){
    if(c===6) c--;
    for(let k=0;k<N;k++){
      const r=up?N-1-k:k;
      for(let d=0;d<2;d++){
        const cc=c-d;
        if(leit[r][cc]) continue;
        m[r][cc]= idx<dbits.length ? dbits[idx++] : 0;
      }
    }
    up=!up;
  }

  /* --- μάσκες --- */
  const maskes=[
    (r,c)=>(r+c)%2===0, (r,c)=>r%2===0, (r,c)=>c%3===0, (r,c)=>(r+c)%3===0,
    (r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0, (r,c)=>((r*c)%2+(r*c)%3)===0,
    (r,c)=>(((r*c)%2+(r*c)%3)%2)===0, (r,c)=>(((r+c)%2+(r*c)%3)%2)===0
  ];
  function poini(g){
    let p=0;
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(c<N-1&&r<N-1&&g[r][c]===g[r][c+1]&&g[r][c]===g[r+1][c]&&g[r][c]===g[r+1][c+1]) p+=3;
    }
    for(let r=0;r<N;r++){
      let run=1;
      for(let c=1;c<N;c++){ if(g[r][c]===g[r][c-1]) run++; else { if(run>=5) p+=3+(run-5); run=1; } }
      if(run>=5) p+=3+(run-5);
    }
    for(let c=0;c<N;c++){
      let run=1;
      for(let r=1;r<N;r++){ if(g[r][c]===g[r-1][c]) run++; else { if(run>=5) p+=3+(run-5); run=1; } }
      if(run>=5) p+=3+(run-5);
    }
    let mavra=0; g.forEach(r=>r.forEach(v=>{ if(v) mavra++; }));
    p+=Math.floor(Math.abs(mavra*100/(N*N)-50)/5)*10;
    return p;
  }

  let kalytero=null, kalyteriPoini=Infinity, kalyteriMaska=0;
  for(let mk=0;mk<8;mk++){
    const g=m.map(r=>r.slice());
    for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(!leit[r][c]&&maskes[mk](r,c)) g[r][c]^=1;
    const fmt=FORMAT_M[mk];
    for(let i=0;i<15;i++){
      const b=(fmt>>i)&1;
      if(i<6) g[8][i]=b; else if(i===6) g[8][7]=b; else if(i===7) g[8][8]=b;
      else if(i===8) g[7][8]=b; else g[14-i][8]=b;
      if(i<8) g[N-1-i][8]=b; else g[8][N-15+i]=b;
    }
    g[N-8][8]=1;
    const pn=poini(g);
    if(pn<kalyteriPoini){ kalyteriPoini=pn; kalytero=g; kalyteriMaska=mk; }
  }
  return {N, plegma:kalytero, ekdosi:ver, maska:kalyteriMaska};
}

function qrSvg(keimeno,pl){
  try{
    const r=qrModules(keimeno), q=4, meg=r.N+q*2;
    let d='';
    for(let i=0;i<r.N;i++) for(let j=0;j<r.N;j++)
      if(r.plegma[i][j]) d+='M'+(j+q)+' '+(i+q)+'h1v1h-1z';
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${meg} ${meg}" width="${pl||260}" height="${pl||260}"
      shape-rendering="crispEdges" style="background:#fff;border-radius:10px">
      <rect width="${meg}" height="${meg}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }catch(err){ return '<div class="note">Ο σύνδεσμος είναι πολύ μεγάλος για κωδικό QR.</div>'; }
}

function keimenoProsklisis(){

function tameioDorou(meDiko){
  const syn=parseFloat(DB.ekdilosi.doroSynolo)||0;
  const alloi=DB.apantiseis.filter(a=>a.doro==='koino'&&(!meDiko||a.id!==EGO));
  let mazemena=alloi.reduce((x,a)=>x+(parseFloat(a.posoDorou)||0),0);
  let atoma=alloi.length;
  if(meDiko&&p.doro==='koino'){ mazemena+=parseFloat(p.posoDorou)||0; atoma++; }
  return {syn, mazemena, ypoloipo:Math.max(0,syn-mazemena), atoma};
}
function anoixeProepis(){

function metritisSymmetoxon(){
  if(!DB.ekdilosi.deixePlithos) return '';

  if(!n.synolo) return '';
  const isos=plithos(true).synolo-n.synolo;
  const meri=[];
  if(n.enilikes) meri.push(n.enilikes+(n.enilikes===1?' ενήλικας':' ενήλικες'));
  if(n.paidia) meri.push(n.paidia+(n.paidia===1?' παιδί':' παιδιά'));
  if(n.vrefi) meri.push(n.vrefi+(n.vrefi===1?' βρέφος':' βρέφη'));
  return `<div class="metritis">Μέχρι τώρα έρχονται <b>${n.synolo}</b>

    </div>

            </div>`:'<div class="empty">Χωρίς απαντήσεις.</div>'}
          <div class="row" style="margin-top:12px">
            <button class="btn ghost mini" data-istor="${i}" style="width:100%">⬇️ Αρχείο</button>
            ${h.ekdilosi?`<button class="btn mini" data-epanafora="${i}" style="width:100%">↩️ Άνοιξέ την</button>`:''}

          </div>`:''}`;}).join('')}</div>

  </div>`;
}

function grammiEidous(it,omada){
  const mon=['τεμ.','λίτρα','μπουκάλια','κιλά','μερίδες','πακέτα'];
  return `<div class="item" data-omada="${omada}" data-id="${it.id}">
    <input type="text" class="i-eik" value="${esc(it.eik)}" maxlength="2" placeholder="🍽️">
    <input type="text" class="i-onoma" value="${esc(it.onoma)}" placeholder="Όνομα είδους">
    <select class="i-monada">${mon.map(m=>`<option ${m===it.monada?'selected':''}>${m}</option>`).join('')}</select>

const LEXEIS_ALK=/μπ[υύ]ρ|κρασ|ποτ[όο]|ουζ|ού?ζο|τσ[ίι]πουρ|ρακ|ουΐ|ουίσκ|whisk|βότκ|βοτκ|τεκ[ίι]λ|ρο[υύ]μι?|σαμπ[άα]ν|λικ[έε]ρ|gin|τζιν|κοκτ[έαι]ιλ|σανγκρ/i;
function protasiPosotitas(onoma,monada,omada){
  const n=(onoma||'').toLowerCase();
  if(omada==='pota'){
    const dynato=/ουζ|τσ[ίι]πουρ|ρακ|β[όο]τκα|ουίσκ|ουισκ|τζιν|ρο[υύ]μι|τεκ[ίι]λ|λικ[έε]ρ|ποτ[όο]/.test(n);
    const krasi=/κρασ|σαμπ[άα]ν/.test(n);
    if(monada==='λίτρα') return dynato?0.15:krasi?0.4:1.2;
    if(monada==='μπουκάλια') return dynato?0.2:krasi?0.5:2;
    if(monada==='τεμ.') return dynato?0.2:krasi?0.5:2.5;
    if(monada==='μερίδες') return dynato?1.5:2;
    if(monada==='κιλά') return 0.5;
    if(monada==='πακέτα') return 0.3;
    return 1;
  }
  const kreas=/κρ[έε]ας|κοτ[όο]πουλ|μπιφτ[έε]κ|λουκ[άα]νικ|ψαρ|χοιριν|μοσχαρ|αρν/.test(n);
  if(monada==='κιλά') return kreas?0.35:0.2;
  if(monada==='μερίδες') return 1;
  if(monada==='τεμ.') return /πίτσα|πιτσα/.test(n)?0.5:/τυροπ|σνακ|κεφτ/.test(n)?3:1;
  if(monada==='πακέτα') return 0.3;
  if(monada==='λίτρα') return 0.2;
  return 1;
}

function syndese(){
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(x=>x.addEventListener(ev,fn));
  const b=(id,fn)=>{const x=el(id); if(x) x.addEventListener('click',fn);};
  document.addEventListener('focusin',ev=>{ if(ev.target.matches('.item input')){ try{ev.target.select();}catch(e){} } });

  on('.choice','click',e=>{ mazepse(); p.apantisi=e.currentTarget.dataset.apantisi; zografise('meros'); });

  on('.nb','click',ev=>{
    const b=ev.currentTarget, x=el(b.dataset.pedio); if(!x) return;
    const min=+x.min||0, max=+x.max||99;
    x.value=Math.min(max,Math.max(min,(+x.value||0)+(+b.dataset.vima)));
    mazepse();
    if(b.dataset.pedio==='theseis') zografise();
  });

  b('naiVan',()=>{ mazepse(); p.vanaki=true; zografise(); });
  b('oxiVan',()=>{ mazepse(); p.vanaki=false; p.leoforeio=false; p.theseis=4; zografise(); });
  b('naiLeo',()=>{ mazepse(); p.leoforeio=true; zografise(); });
  b('oxiLeo',()=>{ mazepse(); p.leoforeio=false; p.theseis=8; zografise(); });
  const thes=el('theseis');
  if(thes) thes.addEventListener('change',()=>{ mazepse(); zografise(); });

  on('[data-parath]','click',ev=>{ mazepse(); anoixtoParathyro=ev.currentTarget.dataset.parath; zografise(); });
  const pd=el('posoDorou');
  if(pd){ ['change','blur'].forEach(t=>pd.addEventListener(t,()=>{ mazepse(); zografise(); })); }
  b('kleiseParath',()=>{ mazepse(); anoixtoParathyro=''; zografise(); });
  on('[data-fers]','click',ev=>{

      DB.ekdilosi.dieuthinsi=kath.slice(0,120); DB.ekdilosi.plat=null; DB.ekdilosi.mik=null;
      await apothikefse();
      minimaPin='Δεν είχε συντεταγμένες, οπότε το έβαλα σαν διεύθυνση. Οι καλεσμένοι θα οδηγηθούν εκεί κανονικά.';
      zografise(); return;
    }
    minimaPin='Δεν κατάλαβα τι είναι αυτό. Δοκίμασε τη διεύθυνση ή δύο αριθμούς, π.χ. 35.33912, 25.13284.';
    zografise();
  }
  b('valePineza',()=>diavaseXarti(el('e_pin').value));

  b('pinezaEdo',()=>{ pedia();
    if(!navigator.geolocation){ minimaPin='Η συσκευή δεν δίνει τοποθεσία. Επικόλλησε συντεταγμένες.'; zografise(); return; }
    minimaPin='Ψάχνω πού είσαι… κράτα το ανοιχτό λίγα δευτερόλεπτα.'; zografise();
    navigator.geolocation.getCurrentPosition(async pos=>{
      DB.ekdilosi.plat=pos.coords.latitude; DB.ekdilosi.mik=pos.coords.longitude;
      await apothikefse();
      minimaPin='Η πινέζα μπήκε εκεί που στέκεσαι.'+(DB.ekdilosi.dieuthinsi?'':' Γράψε και τη διεύθυνση πιο πάνω.');
      zografise();
    },err=>{
      minimaPin = err&&err.code===1 ? 'Δεν δόθηκε άδεια τοποθεσίας. Άνοιξε τις ρυθμίσεις του φυλλομετρητή ή επικόλλησε συντεταγμένες.'
        : err&&err.code===3 ? 'Άργησε πολύ το σήμα. Δοκίμασε ξανά σε ανοιχτό χώρο ή επικόλλησε συντεταγμένες.'
        : 'Δεν πήρα την τοποθεσία. Επικόλλησε συντεταγμένες.';
      zografise();
    },{enableHighAccuracy:true,timeout:15000,maximumAge:0}); });

  b('svisePineza',async()=>{ pedia(); DB.ekdilosi.plat=null; DB.ekdilosi.mik=null; await apothikefse(); minimaPin='Η πινέζα σβήστηκε.'; zografise(); });

  /* κατάλογος */
  document.querySelectorAll('.item .i-monada').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const r=sel.closest('.item'), on=r.querySelector('.i-onoma').value, om=r.dataset.omada;
      const nea=protasiPosotitas(on,sel.value,om);
      r.querySelector('.i-ana').value=arith(nea);
      menouAllages=true;
      const k=el('katastasiMenou');
      if(k) k.textContent='⚠️ Άλλαξε η μονάδα, προσάρμοσα την ποσότητα σε '+arith(nea)+' ανά ενήλικα. Θέλει αποθήκευση.';
    });
  });
  document.querySelectorAll('.item input,.item select,.i-prosf').forEach(x=>{
    x.addEventListener('input',()=>{
      menouAllages=true;
      const k=el('katastasiMenou');
      if(k) k.textContent='⚠️ Έχεις αλλαγές που δεν έχουν αποθηκευτεί. Οι καλεσμένοι βλέπουν ακόμη τον παλιό κατάλογο.';
    });
    x.addEventListener('change',()=>{
      menouAllages=true;
      const k=el('katastasiMenou');
      if(k) k.textContent='⚠️ Έχεις αλλαγές που δεν έχουν αποθηκευτεί. Οι καλεσμένοι βλέπουν ακόμη τον παλιό κατάλογο.';
    });
  });
  on('[data-prosthese]','click',e=>{ mazepseMenou(); menouAllages=true;
    const om=e.currentTarget.dataset.prosthese;
    DB[om].push({id:'x'+Date.now(),eik:'',onoma:'',monada:om==='pota'?'λίτρα':'μερίδες',
      ana:om==='pota'?1:1,alk:false}); zografise(); });
  on('[data-svise]','click',e=>{ mazepseMenou(); menouAllages=true;
    const {svise,omada}=e.currentTarget.dataset; DB[omada]=DB[omada].filter(x=>x.id!==svise); zografise(); });
  const apothikefseMenou=async()=>{
    mazepseMenou(); anagnorisiAlkool();
    DB.pota.concat(DB.fagita).forEach(x=>{ if(!x.ana) x.ana=protasiPosotitas(x.onoma,x.monada,DB.pota.includes(x)?'pota':'fagita'); });
    let kena=0;
    ['pota','fagita'].forEach(om=>{ const prin=DB[om].length;
      DB[om]=DB[om].filter(x=>x.onoma);
      DB[om].forEach(x=>{ if(!x.eik) x.eik=om==='pota'?'🥂':'🍽️'; });
      kena+=prin-DB[om].length; });
    await apothikefse();
    menouAllages=false;
    const orismena=[...DB.pota.filter(x=>x.prosf),...DB.fagita.filter(x=>x.prosf)];
    minimaOk='✅ Ο κατάλογος πέρασε στην πρόσκληση.'
      +(orismena.length?' Οι καλεσμένοι θα δουν: '+orismena.map(x=>x.onoma).join(', ')+'.':'')
      +(kena?' Άφησα έξω '+kena+' γραμμή χωρίς όνομα.':'');
    zografise('panw');
  };
  b('apothMenou',apothikefseMenou);
  b('apothMenouPanw',apothikefseMenou);

  b('ananeosi',async()=>{
    const f=await fresko(); if(f&&f.apantiseis) DB.apantiseis=f.apantiseis;
    const t=new Date().toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'});
    minimaOk='Ανανεώθηκε στις '+t+' — '+DB.apantiseis.length+' απαντήσεις.';
    zografise();
  });
  b('exagogi',()=>katevase(DB.apantiseis,DB.ekdilosi.titlos));
  b('antigrafi',async()=>{
    const n=plithos(meIsos);
    const ola=[...zitisi(DB.pota,'pota',meIsos),...zitisi(DB.fagita,'fagita',meIsos)].filter(x=>x.atoma>0);
    const k='Λίστα αγορών — '+DB.ekdilosi.titlos+'\n'+n.enilikes+' ενήλικες, '+n.paidia+' παιδιά, '+n.vrefi+' βρέφη\n'
      +ola.map(x=>{
        const vasi=x.alk?x.en:x.en+x.pa*0.6, sym=symvouliAgoras(x,vasi*x.ana);
        return '• '+x.onoma+': '+posotita(x)+(sym?' ('+sym+')':'');
      }).join('\n');
    try{ await navigator.clipboard.writeText(k); minimaOk='Η λίστα αντιγράφηκε.'; }
    catch(err){ minimaOk='Δεν έγινε η αντιγραφή.'; }
    zografise();
  });
}

function mazepse(){
  const g=id=>el(id);
  if(g('onoma')) p.onoma=g('onoma').value;
  if(g('en')) p.enilikes=Math.max(0,+g('en').value||0);
  if(g('pa')) p.paidia=Math.max(0,+g('pa').value||0);
  if(g('vr')) p.vrefi=Math.max(0,+g('vr').value||0);
  const kouti=g('onomataL');
  if(kouti) p.onomata=[...kouti.querySelectorAll('.onoma-k')].map(x=>x.value.trim()).filter(Boolean);
  if(g('alergies')) p.alergies=g('alergies').value;
  if(g('elef_pota')) p.elef_pota=g('elef_pota').value;
  if(g('elef_fagita')) p.elef_fagita=g('elef_fagita').value;
  document.querySelectorAll('.fers-ti').forEach(x=>{
    const f=p.ferno.find(y=>y.kat===x.dataset.kat); if(f) f.ti=x.value;
  });
  if(g('theseis')){
    const t=Math.max(0,+g('theseis').value||0);
    p.theseis = p.leoforeio?Math.min(16,t) : p.vanaki?Math.min(9,t) : Math.min(5,t);
    if(p.theseis<=4){ p.vanaki=false; p.leoforeio=false; }
    else if(p.theseis<=8){ p.leoforeio=false; }
  }
  if(g('posoDorou')) p.posoDorou=g('posoDorou').value;
  if(g('simeiosi')) p.simeiosi=g('simeiosi').value;
}
function mazepseMenou(){
  document.querySelectorAll('.item').forEach(r=>{
    const {omada,id}=r.dataset, it=DB[omada].find(x=>x.id===id); if(!it) return;
    it.eik=r.querySelector('.i-eik').value.trim();
    it.onoma=r.querySelector('.i-onoma').value.trim();
    it.monada=r.querySelector('.i-monada').value;
    it.ana=Math.max(0,parseFloat(String(r.querySelector('.i-ana').value).replace(',','.'))||0);
  });
  document.querySelectorAll('.i-prosf').forEach(c=>{
    const it=DB[c.dataset.omada].find(x=>x.id===c.dataset.id); if(it) it.prosf=c.checked;
  });
}

function katevase(lista,titlos){
  const ap = lista||DB.apantiseis;
  const on=(l,ids)=>(ids||[]).map(i=>{const t=l.concat(ADIAFORO).find(x=>x.id===i);return t?t.onoma:'';}).filter(Boolean).join(' | ');
  const kef=['Όνομα','Απάντηση','Ενήλικες','Παιδιά','Βρέφη','Ονόματα','Ποτά','Φαγητά','Θα ήθελε να πιει','Θα ήθελε να φάει','Διατροφή','Αλλεργίες','Φέρνει','Δώρο','Μετακίνηση','Κενές θέσεις στο αυτοκίνητο','Σημείωση','Πότε'];
  const gr=ap.map(a=>[
    a.onoma, a.apantisi==='nai'?'Έρχεται':a.apantisi==='oxi'?'Δεν έρχεται':'Ίσως',
    a.enilikes,a.paidia,a.vrefi,(a.onomata||[]).join(' | '),
    on(DB.pota,a.pota), on(DB.fagita,a.fagita), a.elef_pota||'', a.elef_fagita||'', on(DIATROFI,a.diatrofi), a.alergies||'',
    keimenoFernei(a),
    a.doro==='koino'?'Κοινό δώρο':a.doro==='atomiko'?'Δικό του δώρο':a.doro==='kanena'?'Θα το σκεφτεί':'',
    (METAKINISI.find(m=>m.id===a.metakinisi)||{}).onoma||'', a.theseis||0,
    a.simeiosi||'', new Date(a.pote).toLocaleString('el-GR')]);
  const seires=[kef,...gr];
  const kena=Array(kef.length).fill('');
  const grammiS=(a,b)=>{const r=kena.slice(); r[0]=a; r[1]=b; return r;};
  const naiA=ap.filter(a=>a.apantisi==='nai');
  const plS=naiA.reduce((x,a)=>({e:x.e+(a.enilikes||0),p:x.p+(a.paidia||0),v:x.v+(a.vrefi||0)}),{e:0,p:0,v:0});
  seires.push(kena.slice(), grammiS('ΣΥΝΟΛΑ',''),
    grammiS('Ενήλικες',plS.e), grammiS('Παιδιά',plS.p), grammiS('Βρέφη',plS.v),
    grammiS('Σύνολο ατόμων',plS.e+plS.p+plS.v),
    grammiS('Είπαν ίσως',ap.filter(a=>a.apantisi==='isos').length),
    grammiS('Είπαν όχι',ap.filter(a=>a.apantisi==='oxi').length));
  const anaEidos=(lista,klidi,titlos)=>{
    seires.push(kena.slice(), grammiS(titlos,'Άτομα'));
    lista.forEach(it=>{
      const poioi=naiA.filter(a=>(a[klidi]||[]).includes(it.id));
      if(!poioi.length) return;
      const atoma=poioi.reduce((x,a)=>x+(a.enilikes||0)+(a.paidia||0),0);
      const r=kena.slice(); r[0]=it.onoma; r[1]=atoma; r[2]=poioi.map(x=>x.onoma).join(' | ');
      seires.push(r);
    });
  };
  anaEidos(DB.pota.concat(ADIAFORO[0]),'pota','ΠΟΤΑ');
  anaEidos(DB.fagita.concat(ADIAFORO[1]),'fagita','ΦΑΓΗΤΑ');
  anaEidos(DIATROFI,'diatrofi','ΕΙΔΙΚΕΣ ΜΕΡΙΔΕΣ');
  const k='\ufeff'+seires.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([k],{type:'text/csv;charset=utf-8'}));
  a.download=(titlos||'apantiseis').replace(/[^\wΑ-Ωα-ωά-ώΆ-Ώ]+/g,'_').slice(0,40)+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
}
